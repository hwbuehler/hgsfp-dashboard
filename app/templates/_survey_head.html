<div class="page-head">
  <div>
    <a class="kicker" href="/dashboard">← Analysis dashboard</a>
    <h1>{{ survey.title }}</h1>
    {% if response_count is defined and response_count is not none %}
      <div class="survey-meta">{{ response_count }} responses · {{ survey.slots | length }} course types</div>
    {% endif %}
  </div>
  {% if head_actions %}<div class="button-row">{{ head_actions }}</div>{% endif %}
</div>
