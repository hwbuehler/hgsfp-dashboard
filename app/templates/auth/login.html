{% extends "base.html" %}
{% block title %}Anmelden — HGSFP Umfragen{% endblock %}

{% block content %}
<div style="max-width: 380px; margin: 6vh auto;">
  <h1>Anmelden</h1>
  <p class="lede">Der Editor-Bereich ist geschützt. Die Umfrage selbst bleibt öffentlich zugänglich.</p>

  {% if error %}
    <div class="notice notice-error" style="margin-top: 16px">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" class="card" style="margin-top: 16px">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="field">
      <label for="username">Benutzername</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
